[package]
name = "janex-java"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
description = "Java runtime discovery, manifests, and launch preparation"

[dependencies]
janex-platform.workspace = true
base64 = "0.22"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
