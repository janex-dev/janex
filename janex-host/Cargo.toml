[package]
name = "janex-host"
version.workspace = true
edition.workspace = true

[dependencies]
janex-platform.workspace = true
janex-format.workspace = true
janex-java.workspace = true
janex-signature.workspace = true
thiserror = "2"
tempfile = "3"
url = "2"
packageurl = "0.7"
percent-encoding = "2"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
zeroize = "1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
tar = { version = "0.4", default-features = false }
flate2 = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
semver = "1"
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "xz"] }

[dev-dependencies]
zstd.workspace = true

[lints]
workspace = true
