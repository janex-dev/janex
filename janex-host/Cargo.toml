[package]
name = "janex-host"
version.workspace = true
edition.workspace = true

[dependencies]
janex-format.workspace = true
janex-java.workspace = true
janex-signature.workspace = true
thiserror = "2"
tempfile = "3"
url = "2"
packageurl = "0.7"
percent-encoding = "2"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
zeroize = "1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
zstd = "0.14"

[lints]
workspace = true
