name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '8'
      - name: Retain Java 8 for launch tests
        shell: bash
        run: echo "JANEX_TEST_JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        shell: bash
        run: bash ./gradlew --no-daemon build
      - name: Verify generated CMS signatures with OpenSSL
        run: python janex-signature/tests/fixtures/cms/check_generated.py
      - name: Verify generated OpenPGP signatures with GnuPG
        run: python janex-signature/tests/fixtures/openpgp/check_generated.py
