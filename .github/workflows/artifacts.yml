name: Build artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            os: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            platform: linux-arm64
            os: ubuntu-26.04-arm
          - target: x86_64-unknown-freebsd
            platform: freebsd-x86_64
            os: ubuntu-26.04
          - target: aarch64-unknown-freebsd
            platform: freebsd-arm64
            os: ubuntu-26.04-arm
          - target: i686-pc-windows-msvc
            platform: windows-x86
            os: windows-2025
          - target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            platform: windows-arm64
            os: windows-11-arm
          - target: x86_64-apple-darwin
            platform: macos-x86_64
            os: macos-15-intel
          - target: aarch64-apple-darwin
            platform: macos-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check release version
        if: github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ($env:RELEASE_TAG -cne "v$version") { throw "Release tag does not match Cargo.toml version" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.os == 'windows-11-arm' && 'stable-aarch64-pc-windows-msvc' || 'stable' }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '25'
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: '0.15.2'
          cache-key: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-zigbuild --version 0.23.4 --locked
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils binutils-aarch64-linux-gnu qemu-user xz-utils
      - name: Install xz
        if: runner.os == 'macOS'
        run: command -v xz >/dev/null || brew install xz
      - name: Build, verify, and package Unix binaries
        if: runner.os != 'Windows'
        env:
          JANEX_TARGET: ${{ matrix.target }}
        run: bash ./gradlew --no-daemon packageArtifacts -PjanexTarget="$JANEX_TARGET"
      - name: Build, verify, and package Windows binaries
        if: runner.os == 'Windows'
        env:
          JANEX_TARGET: ${{ matrix.target }}
        run: .\gradlew.bat --no-daemon packageArtifacts "-PjanexTarget=$env:JANEX_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: janex-${{ matrix.platform }}
          path: build/distributions/janex-${{ matrix.platform }}.${{ runner.os == 'Windows' && 'zip' || 'tar.xz' }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          archive: false

  publish-release:
    name: Upload release distributions
    needs: build
    if: github.event_name == 'release' && github.repository == 'janex-dev/janex'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: janex-*
          path: distributions
          merge-multiple: true
          skip-decompress: true
      - name: Upload distribution archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" distributions/*
