name: Build artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04-arm
          - target: x86_64-unknown-freebsd
            os: ubuntu-26.04
          - target: aarch64-unknown-freebsd
            os: ubuntu-26.04-arm
          - target: i686-pc-windows-msvc
            os: windows-2025
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.os == 'windows-11-arm' && 'stable-aarch64-pc-windows-msvc' || 'stable' }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '25'
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: '0.15.2'
          cache-key: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-zigbuild --version 0.23.4 --locked
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils binutils-aarch64-linux-gnu qemu-user xz-utils
      - name: Install xz
        if: runner.os == 'macOS'
        run: command -v xz >/dev/null || brew install xz
      - name: Build, verify, and package Unix binaries
        if: runner.os != 'Windows'
        env:
          JANEX_TARGET: ${{ matrix.target }}
        run: bash ./gradlew --no-daemon packageArtifacts -PjanexTarget="$JANEX_TARGET"
      - name: Build, verify, and package Windows binaries
        if: runner.os == 'Windows'
        env:
          JANEX_TARGET: ${{ matrix.target }}
        run: .\gradlew.bat --no-daemon packageArtifacts "-PjanexTarget=$env:JANEX_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: janex-${{ matrix.target }}
          path: build/distributions/janex-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.xz' }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          archive: false
