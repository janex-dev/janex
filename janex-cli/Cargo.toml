[package]
name = "janex-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "janex"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
janex-core.workspace = true
rpassword = "7"
zeroize = "1"

[dev-dependencies]
pgp = { version = "0.20", default-features = false }
tempfile = "3"
janex-format.workspace = true

[lints]
workspace = true
